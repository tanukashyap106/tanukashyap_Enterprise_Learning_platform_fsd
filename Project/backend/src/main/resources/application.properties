# MySQL Database Connection
spring.datasource.url=jdbc:mysql://${skillsphere.db.host}:${skillsphere.db.port}/${skillsphere.db.name}?useSSL=false&serverTimezone=UTC&tcpKeepAlive=true&autoReconnect=true
